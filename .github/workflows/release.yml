name: Build & Release iOS IPA

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run ScrcpyKit Tests
        run: swift run ScrcpyTests

      - name: Build Release Archive
        run: |
          xcodebuild -project ScrcpyiOS.xcodeproj \
            -scheme ScrcpyApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Scrcpy.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Scrcpy.xcarchive/Products/Applications/ScrcpyApp.app build/Payload/
          cd build && zip -qry Scrcpy.ipa Payload
          ls -lh Scrcpy.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scrcpy-IPA
          path: build/Scrcpy.ipa
          retention-days: 30

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            TITLE="Release $TAG"
            PRERELEASE_FLAG=""
          else
            TAG="latest"
            TITLE="Latest Build (main)"
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading/overwriting Scrcpy.ipa..."
            gh release upload "$TAG" build/Scrcpy.ipa --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" build/Scrcpy.ipa \
              --title "$TITLE" \
              $PRERELEASE_FLAG \
              --generate-notes
          fi
