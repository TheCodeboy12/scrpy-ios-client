name: Build & Release iOS IPA

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run ScrcpyKit Tests
        run: swift run ScrcpyTests

      - name: Build Release Archive
        run: |
          xcodebuild -project ScrcpyiOS.xcodeproj \
            -scheme ScrcpyApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Scrcpy.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Scrcpy.xcarchive/Products/Applications/ScrcpyApp.app build/Payload/
          cd build && zip -qry Scrcpy.ipa Payload
          ls -lh Scrcpy.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scrcpy-IPA
          path: build/Scrcpy.ipa
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build (main)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: build/Scrcpy.ipa
          generate_release_notes: true
